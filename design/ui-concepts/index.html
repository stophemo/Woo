<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Woo UI Concepts</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      font-family: "SF Pro Display", "SF Pro Text", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      color: #26343a;
      background: #151a18;
      font-synthesis: none;
    }
    body { margin: 0; min-width: 1500px; min-height: 960px; letter-spacing: 0; }
    button, input { font: inherit; letter-spacing: 0; }
    button { color: inherit; }
    svg { display: block; }
    .board {
      position: relative;
      width: 1600px;
      height: 1000px;
      overflow: hidden;
      background: #151a18;
    }
    .board::before, .board::after {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      content: "";
      background: rgba(255,255,255,.08);
    }
    .board::before { left: 110px; }
    .board::after { right: 110px; }
    .concept-label {
      position: absolute;
      top: 28px;
      left: 128px;
      z-index: 10;
      display: flex;
      align-items: baseline;
      gap: 12px;
      color: #f5f7f3;
    }
    .concept-label b { font-size: 17px; }
    .concept-label span { color: #9ba69f; font-size: 13px; }
    .window {
      position: absolute;
      top: 76px;
      left: 182px;
      width: 1338px;
      height: 850px;
      overflow: hidden;
      border: 1px solid #6f7975;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 30px 90px rgba(0,0,0,.36);
    }
    .titlebar {
      position: relative;
      display: flex;
      align-items: center;
      height: 56px;
      border-bottom: 1px solid var(--line);
      background: var(--chrome);
    }
    .lights { display: flex; gap: 10px; margin-left: 22px; }
    .light { width: 15px; height: 15px; border-radius: 50%; }
    .light.red { background: #ee655c; }
    .light.yellow { background: #e8b548; }
    .light.green { background: #49a872; }
    .window-title {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-size: 14px;
      font-weight: 680;
      color: var(--muted);
    }
    .save-state {
      margin-left: auto;
      margin-right: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
    }
    .save-state i { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
    .app { display: grid; height: calc(100% - 56px); }
    .rail, .sidebar, .documents, .editor, .inspector { min-width: 0; overflow: hidden; }
    .icon {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 7px;
      display: grid;
      place-items: center;
      background: #212646;
      color: #f9f6ed;
      font-family: Georgia, serif;
      font-size: 20px;
      font-weight: 700;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.12);
    }
    .search {
      height: 34px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      border: 1px solid var(--line-soft);
      border-radius: 6px;
      background: var(--search-bg);
      color: var(--faint);
      font-size: 12px;
    }
    .search .icon { width: 15px; height: 15px; }
    .round-button {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 6px;
      background: transparent;
    }
    .round-button .icon { width: 18px; height: 18px; }
    .editor-head {
      display: flex;
      align-items: center;
      height: 52px;
      padding: 0 22px;
      border-bottom: 1px solid var(--line-soft);
      background: var(--editor-chrome);
    }
    .toolbar { display: flex; align-items: center; gap: 4px; }
    .tool {
      width: 31px;
      height: 31px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
    }
    .tool.active { background: var(--accent-soft); color: var(--accent-strong); }
    .tool-sep { width: 1px; height: 18px; margin: 0 5px; background: var(--line); }
    .editor-actions { margin-left: auto; display: flex; gap: 4px; }
    .paper {
      height: calc(100% - 84px);
      overflow: hidden;
      background: var(--paper);
    }
    .article { max-width: 760px; margin: 0 auto; padding: 60px 34px 120px; }
    .article .eyebrow { margin: 0 0 22px; color: var(--accent-strong); font-size: 12px; font-weight: 680; }
    .article h1 { margin: 0 0 30px; color: var(--heading); font-size: 36px; line-height: 1.25; letter-spacing: 0; }
    .article h2 { margin: 34px 0 12px; color: var(--heading); font-size: 19px; letter-spacing: 0; }
    .article p { margin: 0 0 17px; color: var(--body); font-size: 15px; line-height: 1.92; }
    .article blockquote {
      margin: 28px 0;
      padding: 15px 18px;
      border-left: 3px solid var(--accent);
      background: var(--quote-bg);
      color: var(--muted);
      font-size: 14px;
      line-height: 1.75;
    }
    .statusbar {
      height: 32px;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 0 18px;
      border-top: 1px solid var(--line-soft);
      background: var(--editor-chrome);
      color: var(--faint);
      font-size: 11px;
    }
    .statusbar .saved { margin-left: auto; color: var(--muted); }
    .statusbar .saved::before { display: inline-block; width: 7px; height: 7px; margin-right: 7px; border-radius: 2px; background: var(--green); content: ""; }
    .phone {
      position: absolute;
      z-index: 6;
      left: 58px;
      bottom: -82px;
      width: 342px;
      height: 590px;
      overflow: hidden;
      border: 1px solid #96a09c;
      border-radius: 22px;
      background: var(--phone-bg);
      box-shadow: 0 28px 80px rgba(0,0,0,.42);
    }
    .phone::before {
      position: absolute;
      top: 10px;
      left: 50%;
      width: 60px;
      height: 5px;
      border-radius: 5px;
      transform: translateX(-50%);
      background: rgba(30,40,36,.18);
      content: "";
    }
    .phone-top {
      height: 74px;
      display: flex;
      align-items: flex-end;
      padding: 0 20px 14px;
      border-bottom: 1px solid var(--line-soft);
      background: var(--phone-bg);
    }
    .phone-top strong { font-size: 22px; color: var(--heading); }
    .phone-top button { margin-left: auto; border: 0; background: transparent; color: var(--accent-strong); }
    .phone-tabs { display: flex; gap: 8px; padding: 12px 18px; border-bottom: 1px solid var(--line-soft); background: var(--phone-strip); }
    .phone-tab { padding: 7px 13px; border: 1px solid var(--line); border-radius: 5px; color: var(--muted); font-size: 11px; }
    .phone-tab.active { border-color: var(--accent); background: var(--accent); color: white; }
    .phone-note { padding: 18px 20px; border-bottom: 1px solid var(--line-soft); background: var(--phone-bg); }
    .phone-note strong { display: block; margin-bottom: 7px; color: var(--heading); font-size: 14px; }
    .phone-note p { margin: 0 0 8px; color: var(--muted); font-size: 11px; line-height: 1.55; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .phone-note small { color: var(--faint); font-size: 10px; }
    .phone-bottom {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      height: 62px;
      border-top: 1px solid var(--line-soft);
      background: var(--phone-bg);
    }
    .phone-bottom span { display: grid; place-items: center; color: var(--faint); font-size: 11px; }
    .phone-bottom span.active { color: var(--accent-strong); font-weight: 680; }

    /* Concept A: quiet paper */
    body[data-concept="a"] {
      --chrome: #e7eef0; --line: #cdd9dd; --line-soft: #dce6e9;
      --sidebar-bg: #edf3f5; --documents-bg: #f2f6f7; --search-bg: #f8fbfb;
      --editor-chrome: #f5f8f8; --paper: #fcfdfd; --phone-bg: #fbfcfc; --phone-strip: #f0f5f6;
      --heading: #203139; --body: #526a74; --muted: #687f88; --faint: #93a5ac;
      --accent: #4597b7; --accent-strong: #2c7794; --accent-soft: #dceef4;
      --green: #38a578; --quote-bg: #edf4f6;
    }
    body[data-concept="a"] .app { grid-template-columns: 242px 324px 1fr; }
    body[data-concept="a"] .sidebar { padding: 22px 18px; border-right: 1px solid var(--line); background: var(--sidebar-bg); }
    body[data-concept="a"] .side-brand { display: flex; align-items: center; gap: 11px; margin: 0 2px 24px; color: var(--heading); font-weight: 720; }
    body[data-concept="a"] .nav-primary { display: grid; gap: 5px; }
    body[data-concept="a"] .nav-item { display: flex; align-items: center; gap: 11px; height: 40px; padding: 0 12px; border-radius: 6px; color: var(--muted); font-size: 13px; }
    body[data-concept="a"] .nav-item.active { background: #d9eaf0; color: var(--accent-strong); font-weight: 680; }
    body[data-concept="a"] .nav-item .icon { width: 17px; height: 17px; }
    body[data-concept="a"] .folder-title { display: flex; align-items: center; margin: 26px 10px 8px; color: var(--faint); font-size: 11px; }
    body[data-concept="a"] .folder-title button { margin-left: auto; }
    body[data-concept="a"] .folder { display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 12px; border-radius: 6px; color: var(--muted); font-size: 13px; }
    body[data-concept="a"] .folder i { width: 9px; height: 9px; border-radius: 3px; background: #3c9fbe; }
    body[data-concept="a"] .folder:nth-of-type(2) i { background: #42a678; }
    body[data-concept="a"] .folder:nth-of-type(3) i { background: #ee734e; }
    body[data-concept="a"] .folder.active { background: #dcecf1; color: var(--accent-strong); font-weight: 680; }
    body[data-concept="a"] .documents { padding: 23px 16px; border-right: 1px solid var(--line); background: var(--documents-bg); }
    body[data-concept="a"] .docs-head { display: flex; align-items: center; margin: 0 5px 18px; }
    body[data-concept="a"] .docs-head div span { display: block; margin-bottom: 4px; color: var(--faint); font-size: 11px; }
    body[data-concept="a"] .docs-head strong { color: var(--heading); font-size: 20px; }
    body[data-concept="a"] .docs-head button { margin-left: auto; color: var(--accent-strong); }
    body[data-concept="a"] .search { margin-bottom: 14px; }
    body[data-concept="a"] .doc-card { margin-bottom: 10px; padding: 16px; border: 1px solid transparent; border-radius: 7px; background: rgba(255,255,255,.78); }
    body[data-concept="a"] .doc-card.active { border-color: var(--accent); background: #fff; box-shadow: 0 3px 12px rgba(50,100,120,.08); }
    body[data-concept="a"] .doc-card strong { display: block; margin-bottom: 8px; color: var(--heading); font-size: 14px; }
    body[data-concept="a"] .doc-card p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.65; }
    body[data-concept="a"] .doc-card time { display: block; margin-top: 12px; text-align: right; color: var(--faint); font-size: 10px; }

    /* Concept B: compact archive */
    body[data-concept="b"] {
      --chrome: #f2f3ef; --line: #d7dbd4; --line-soft: #e4e7e1;
      --sidebar-bg: #20342f; --documents-bg: #f4f6f2; --search-bg: #fff;
      --editor-chrome: #fafbf8; --paper: #fff; --phone-bg: #fff; --phone-strip: #f2f5f0;
      --heading: #22312d; --body: #52635d; --muted: #6d7b76; --faint: #9aa49f;
      --accent: #d36b4b; --accent-strong: #ad4d32; --accent-soft: #f5e3dc;
      --green: #3e9b70; --quote-bg: #f1f5f1;
    }
    body[data-concept="b"] .app { grid-template-columns: 74px 394px 1fr; }
    body[data-concept="b"] .rail { display: flex; flex-direction: column; align-items: center; padding: 20px 0; background: var(--sidebar-bg); color: #b8c6c0; }
    body[data-concept="b"] .rail .brand-mark { margin-bottom: 27px; }
    body[data-concept="b"] .rail-button { width: 42px; height: 42px; display: grid; place-items: center; margin-bottom: 8px; border-radius: 6px; }
    body[data-concept="b"] .rail-button.active { background: #36514a; color: #fff; }
    body[data-concept="b"] .rail-button .icon { width: 19px; height: 19px; }
    body[data-concept="b"] .rail-bottom { margin-top: auto; }
    body[data-concept="b"] .documents { border-right: 1px solid var(--line); background: var(--documents-bg); }
    body[data-concept="b"] .library-head { padding: 24px 24px 17px; border-bottom: 1px solid var(--line-soft); }
    body[data-concept="b"] .library-title { display: flex; align-items: center; margin-bottom: 18px; }
    body[data-concept="b"] .library-title div span { color: var(--faint); font-size: 11px; }
    body[data-concept="b"] .library-title strong { display: block; margin-top: 3px; color: var(--heading); font-size: 21px; }
    body[data-concept="b"] .library-title button { margin-left: auto; background: var(--accent); color: #fff; }
    body[data-concept="b"] .folder-pills { display: flex; gap: 7px; margin-top: 13px; }
    body[data-concept="b"] .pill { padding: 6px 10px; border-radius: 4px; background: #e8ece6; color: var(--muted); font-size: 10px; }
    body[data-concept="b"] .pill.active { background: #314a43; color: #fff; }
    body[data-concept="b"] .doc-row { display: grid; grid-template-columns: 5px 1fr auto; gap: 14px; align-items: start; padding: 18px 22px; border-bottom: 1px solid var(--line-soft); }
    body[data-concept="b"] .doc-row .mark { width: 5px; height: 44px; border-radius: 3px; background: #cbd4cf; }
    body[data-concept="b"] .doc-row.active { background: #fff; }
    body[data-concept="b"] .doc-row.active .mark { background: var(--accent); }
    body[data-concept="b"] .doc-row strong { display: block; margin-bottom: 7px; color: var(--heading); font-size: 14px; }
    body[data-concept="b"] .doc-row p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.55; }
    body[data-concept="b"] .doc-row time { color: var(--faint); font-size: 10px; }
    body[data-concept="b"] .article { max-width: 720px; padding-top: 68px; }
    body[data-concept="b"] .article h1 { font-family: "Songti SC", "STSong", serif; font-size: 39px; font-weight: 760; }

    /* Concept C: structured studio */
    body[data-concept="c"] {
      --chrome: #202827; --line: #ced6d3; --line-soft: #e0e6e3;
      --sidebar-bg: #edf1ef; --documents-bg: #f7f9f8; --search-bg: #fff;
      --editor-chrome: #f8faf9; --paper: #fff; --phone-bg: #fbfcfc; --phone-strip: #edf2f0;
      --heading: #1f2b29; --body: #4d615d; --muted: #667975; --faint: #97a7a3;
      --accent: #d5a128; --accent-strong: #8f6710; --accent-soft: #f6edcf;
      --green: #36a273; --quote-bg: #eef5f2;
    }
    body[data-concept="c"] .window-title, body[data-concept="c"] .save-state { color: #bdc7c3; }
    body[data-concept="c"] .app { grid-template-columns: 214px 276px 1fr 220px; }
    body[data-concept="c"] .sidebar { border-right: 1px solid var(--line); background: var(--sidebar-bg); }
    body[data-concept="c"] .workspace-brand { display: flex; align-items: center; gap: 10px; height: 68px; padding: 0 18px; border-bottom: 1px solid var(--line); color: var(--heading); font-weight: 720; }
    body[data-concept="c"] .workspace-brand .brand-mark { width: 32px; height: 32px; font-size: 18px; }
    body[data-concept="c"] .side-section { padding: 18px 14px 6px; color: var(--faint); font-size: 10px; font-weight: 700; text-transform: uppercase; }
    body[data-concept="c"] .workspace-item { display: flex; align-items: center; gap: 10px; height: 37px; margin: 0 9px 3px; padding: 0 10px; border-radius: 5px; color: var(--muted); font-size: 12px; }
    body[data-concept="c"] .workspace-item .icon { width: 16px; height: 16px; }
    body[data-concept="c"] .workspace-item.active { background: #dbe6e2; color: #225f53; font-weight: 680; }
    body[data-concept="c"] .workspace-item small { margin-left: auto; color: var(--faint); }
    body[data-concept="c"] .documents { border-right: 1px solid var(--line); background: var(--documents-bg); }
    body[data-concept="c"] .docs-compact-head { height: 68px; padding: 14px 16px; border-bottom: 1px solid var(--line-soft); }
    body[data-concept="c"] .docs-compact-title { display: flex; align-items: center; }
    body[data-concept="c"] .docs-compact-title strong { color: var(--heading); font-size: 15px; }
    body[data-concept="c"] .docs-compact-title span { margin-left: 7px; color: var(--faint); font-size: 10px; }
    body[data-concept="c"] .docs-compact-title button { margin-left: auto; color: #226f60; }
    body[data-concept="c"] .compact-search { margin: 10px 12px; }
    body[data-concept="c"] .compact-row { padding: 14px 16px; border-top: 1px solid var(--line-soft); }
    body[data-concept="c"] .compact-row.active { box-shadow: inset 3px 0 0 #2c8b79; background: #fff; }
    body[data-concept="c"] .compact-row strong { display: block; margin-bottom: 7px; color: var(--heading); font-size: 12px; line-height: 1.45; }
    body[data-concept="c"] .compact-row p { margin: 0 0 8px; color: var(--muted); font-size: 10px; line-height: 1.5; }
    body[data-concept="c"] .compact-row small { color: var(--faint); font-size: 9px; }
    body[data-concept="c"] .editor-head { padding: 0 16px; }
    body[data-concept="c"] .article { max-width: 650px; padding: 52px 28px; }
    body[data-concept="c"] .article h1 { font-size: 32px; }
    body[data-concept="c"] .inspector { border-left: 1px solid var(--line); background: #f7f9f8; }
    body[data-concept="c"] .inspector-tabs { display: grid; grid-template-columns: 1fr 1fr; height: 48px; border-bottom: 1px solid var(--line-soft); }
    body[data-concept="c"] .inspector-tabs span { display: grid; place-items: center; color: var(--faint); font-size: 11px; }
    body[data-concept="c"] .inspector-tabs span.active { box-shadow: inset 0 -2px 0 #2c8b79; color: #226f60; font-weight: 680; }
    body[data-concept="c"] .outline { padding: 22px 16px; }
    body[data-concept="c"] .outline-label { margin-bottom: 13px; color: var(--faint); font-size: 10px; }
    body[data-concept="c"] .outline-item { padding: 8px 9px; border-left: 1px solid #cfd8d4; color: var(--muted); font-size: 10px; line-height: 1.45; }
    body[data-concept="c"] .outline-item.active { border-left: 2px solid #2c8b79; background: #e8f0ed; color: #225f53; font-weight: 680; }
    body[data-concept="c"] .inspector-card { margin: 20px 14px; padding: 13px; border: 1px solid var(--line-soft); border-radius: 6px; background: #fff; }
    body[data-concept="c"] .inspector-card span { color: var(--faint); font-size: 9px; }
    body[data-concept="c"] .inspector-card strong { display: block; margin: 7px 0 5px; color: var(--heading); font-size: 11px; }
    body[data-concept="c"] .inspector-card p { margin: 0; color: var(--muted); font-size: 9px; line-height: 1.55; }
    body[data-concept="c"] .phone { left: 46px; }
  </style>
</head>
<body data-concept="a">
  <main class="board">
    <div class="concept-label"><b id="concept-name">方案 A · 静纸</b><span id="concept-desc">宽松三栏，安静而清晰</span></div>
    <section class="window">
      <header class="titlebar">
        <div class="lights"><i class="light red"></i><i class="light yellow"></i><i class="light green"></i></div>
        <div class="window-title">无我笔记</div>
        <div class="save-state"><i></i>已保存</div>
      </header>
      <div class="app" id="app"></div>
    </section>
    <aside class="phone">
      <header class="phone-top"><strong>文稿</strong><button aria-label="新建文稿"><svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></header>
      <div class="phone-tabs"><span class="phone-tab active">全部</span><span class="phone-tab">写作</span><span class="phone-tab">灵感</span></div>
      <article class="phone-note"><strong>随手记：回家路上的想法</strong><p>先记下来，晚上再回到电脑继续整理。</p><small>刚刚 · 本地保存</small></article>
      <article class="phone-note"><strong>让工具退后，让思考向前</strong><p>好的写作工具，不应该把注意力放在自己身上。</p><small>10:24 · 已同步</small></article>
      <article class="phone-note"><strong>七月阅读手记</strong><p>真正留下来的，不是读过多少，而是重新想过什么。</p><small>昨天</small></article>
      <nav class="phone-bottom"><span class="active">文稿</span><span>搜索</span><span>设置</span></nav>
    </aside>
  </main>
  <script>
    const icons = {
      plus: '<svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
      search: '<svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>',
      file: '<svg class="icon" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v5h5"/></svg>',
      folder: '<svg class="icon" viewBox="0 0 24 24"><path d="M3 6h7l2 2h9v11H3z"/></svg>',
      trash: '<svg class="icon" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13"/></svg>',
