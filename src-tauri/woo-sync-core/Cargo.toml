[package]
name = "woo-sync-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Woo 笔记端到端加密同步内核"

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
flate2 = "1"
getrandom = "0.2"
hkdf = "0.12"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
zeroize = "1"
